version: '3.8'

services:
  vaultmesh:
    build: .
    container_name: vaultmesh-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      # Persist SQLite database across container restarts
      - vaultmesh-data:/app/data

volumes:
  vaultmesh-data:
